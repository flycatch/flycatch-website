name: Quality Gates

on:
  push:
    branches: [main, '001-website-foundation']
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openapi-spec-validator
      - run: node scripts/validate-contracts.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ./apps/Backend[dev]
      - run: pytest apps/Backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/Frontend/pnpm-lock.yaml
      - run: pnpm install
        working-directory: apps/Frontend
      - run: pnpm run build
        working-directory: apps/Frontend
      - run: pnpm run test:unit
        working-directory: apps/Frontend
      - run: pnpm run check:all
        working-directory: apps/Frontend
