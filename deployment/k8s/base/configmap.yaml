apiVersion: v1
kind: ConfigMap
metadata:
  name: flycatch-website-config
  labels:
    app.kubernetes.io/name: flycatch-website
data:
  PUBLIC_ORIGIN: https://flycatch-website-dev.k3s.flycatchtech.in
  PUBLIC_ENVIRONMENT: development
  API_ORIGIN: http://backend:8000
  ENVIRONMENT: development
  S3_ENDPOINT: http://minio.database.svc.cluster.local:9000
  S3_BUCKET: flycatch-website
  S3_REGION: us-east-1
  S3_USE_SSL: "false"
  JWT_ACCESS_MINUTES: "15"
  GATEWAY_PORT: "8080"
  # Google published test site key (localhost only). Replace for real hostnames.
  PUBLIC_RECAPTCHA_SITE_KEY: "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
