apiVersion: apps/v1
kind: Deployment
metadata:
  name: administration-fe
  labels:
    app.kubernetes.io/name: flycatch-website
    app.kubernetes.io/component: administration-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flycatch-website
      app.kubernetes.io/component: administration-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flycatch-website
        app.kubernetes.io/component: administration-fe
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: administration-fe
          image: registry.k3s.flycatchtech.in/flycatch-website/administration-fe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4173
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
