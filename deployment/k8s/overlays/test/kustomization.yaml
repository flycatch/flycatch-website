apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flycatch-website-test

resources:
- ../../base
- ingress.yaml
- noindex-middleware.yaml

# Keep environment-specific values out of the shared base.  The public origin is
# consumed by the Backend; Astro embeds its equivalent at image-build time.
patches:
- patch: |-
    - op: replace
      path: /data/PUBLIC_ORIGIN
      value: https://flycatch-website-test.k3s.flycatchtech.in
    - op: replace
      path: /data/PUBLIC_ENVIRONMENT
      value: development
    - op: replace
      path: /data/ENVIRONMENT
      value: test
  target:
    kind: ConfigMap
    name: flycatch-website-config
    version: v1

images:
- name: registry.k3s.flycatchtech.in/flycatch-website/administration-fe
  newTag: test-v0.1.0.30
- name: registry.k3s.flycatchtech.in/flycatch-website/backend
  newTag: test-v0.1.0.30
- name: registry.k3s.flycatchtech.in/flycatch-website/frontend
  newTag: test-v0.1.0.30

replicas:
- count: 1
  name: backend
- count: 1
  name: frontend
- count: 1
  name: administration-fe
- count: 1
  name: gateway
