apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flycatch-website-prod

resources:
- ../../base
- ingress.yaml
- letsencrypt-http01-issuer.yaml
- redirect-https-middleware.yaml

patches:
- path: config-patch.yaml

images:
- name: registry.k3s.flycatchtech.in/flycatch-website/administration-fe
  newTag: v0.2.0
- name: registry.k3s.flycatchtech.in/flycatch-website/backend
  newTag: v0.2.0
- name: registry.k3s.flycatchtech.in/flycatch-website/frontend
  newTag: v0.2.0

replicas:
- count: 1
  name: backend
- count: 1
  name: frontend
- count: 1
  name: administration-fe
- count: 1
  name: gateway
