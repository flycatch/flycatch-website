apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flycatch-website-dev

resources:
  - ../../base
  - ingress.yaml
  - noindex-middleware.yaml

images:
  - name: registry.k3s.flycatchtech.in/flycatch-website/backend
    newName: registry.k3s.flycatchtech.in/flycatch-website/backend
    newTag: latest
  - name: registry.k3s.flycatchtech.in/flycatch-website/frontend
    newName: registry.k3s.flycatchtech.in/flycatch-website/frontend
    newTag: latest
  - name: registry.k3s.flycatchtech.in/flycatch-website/administration-fe
    newName: registry.k3s.flycatchtech.in/flycatch-website/administration-fe
    newTag: latest

replicas:
  - count: 1
    name: backend
  - count: 1
    name: frontend
  - count: 1
    name: administration-fe
  - count: 1
    name: gateway
