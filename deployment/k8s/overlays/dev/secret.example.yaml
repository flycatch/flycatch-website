# Opaque Secret — create in-cluster; do NOT commit real values.
# Example:
#   kubectl -n flycatch-website-dev create secret generic flycatch-website-secrets \
#     --from-literal=DATABASE_URL='postgresql+psycopg://flycatch_website:PASSWORD@postgres.database.svc.cluster.local:5432/flycatch_website' \
#     --from-literal=S3_ACCESS_KEY='...' \
#     --from-literal=S3_SECRET_KEY='...' \
#     --from-literal=SESSION_SECRET='...' \
#     --from-literal=CSRF_SECRET='...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=BUILD_EXPORT_TOKEN='...' \
#     --from-literal=RECAPTCHA_SECRET_KEY='...' \
#     --from-literal=SMTP_HOST='in-v3.mailjet.com' \
#     --from-literal=SMTP_PORT='587' \
#     --from-literal=SMTP_USERNAME='...' \
#     --from-literal=SMTP_PASSWORD='...' \
#     --from-literal=SMTP_USE_TLS='true'
apiVersion: v1
kind: Secret
metadata:
  name: flycatch-website-secrets
  labels:
    app.kubernetes.io/name: flycatch-website
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://flycatch_website:REPLACE_ME_POSTGRES_PASSWORD@postgres.database.svc.cluster.local:5432/flycatch_website
  S3_ACCESS_KEY: REPLACE_ME_MINIO_ACCESS_KEY
  S3_SECRET_KEY: REPLACE_ME_MINIO_SECRET_KEY
  SESSION_SECRET: REPLACE_ME_LONG_RANDOM_SESSION_SECRET
  CSRF_SECRET: REPLACE_ME_LONG_RANDOM_CSRF_SECRET
  JWT_SECRET: REPLACE_ME_LONG_RANDOM_JWT_SECRET
  BUILD_EXPORT_TOKEN: REPLACE_ME_BUILD_EXPORT_TOKEN
  # Pair with PUBLIC_RECAPTCHA_SITE_KEY in ConfigMap. Never commit the real secret.
  RECAPTCHA_SECRET_KEY: REPLACE_ME_RECAPTCHA_SECRET_KEY
  SMTP_HOST: in-v3.mailjet.com
  SMTP_PORT: "587"
  SMTP_USERNAME: REPLACE_ME_MAILJET_API_KEY
  SMTP_PASSWORD: REPLACE_ME_MAILJET_SECRET_KEY
  SMTP_USE_TLS: "true"
