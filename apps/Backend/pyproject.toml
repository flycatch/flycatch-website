[project]
name = "flycatch-api"
version = "0.1.0"
description = "Flycatch Website Foundation API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.38",
    "psycopg[binary]>=3.2.5",
    "alembic>=1.14.1",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "argon2-cffi>=23.1.0",
    "boto3>=1.37.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    "openapi-spec-validator>=0.7.1",
    "pyyaml>=6.0.2",
    "PyJWT>=2.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9.9",
]

[project.scripts]
flycatch-provision-admin = "flycatch_api.cli.provision_admin:main"
flycatch-seed-records = "flycatch_api.cli.seed_records:main"
flycatch-bootstrap = "flycatch_api.cli.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flycatch_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
