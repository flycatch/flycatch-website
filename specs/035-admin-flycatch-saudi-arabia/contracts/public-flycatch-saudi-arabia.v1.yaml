openapi: 3.1.0
info:
  title: Public FlycatchSaudiArabia
  version: 1.0.0
servers:
  - url: /api/v1
security: []
paths:
  /public/flycatch-saudi-arabia:
    get:
      operationId: listPublicFlycatchSaudiArabia
      summary: List published records
      tags: [public]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlycatchSaudiArabiaList'
  /public/flycatch-saudi-arabia/{item_id}:
    get:
      operationId: getPublicFlycatchSaudiArabia
      summary: Return one published record
      tags: [public]
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlycatchSaudiArabia'
        '404':
          $ref: '#/components/responses/PublicNotFound'
components:
  schemas:

    ContentSeo:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        description: { type: string }
        canonical_url: { type: string }
        meta_title: { type: string }
        h1_tag: { type: string }
        image_alt: { type: string }
        image_key: { type: string, nullable: true }

    ServiceSectionItem:
      type: object
      additionalProperties: false
      properties:
        image_key: { type: string, nullable: true }
        types_title: { type: string, default: '' }
        contents: { type: string, default: '' }
        links: { type: string, default: '' }

    PublicFlycatchSaudiArabia:
      type: object
      additionalProperties: false
      required: [id, banner_title, service_section, banner_explore_text, services_title, seo]
      properties:
        id: { type: string, format: uuid }
        banner_title: { type: string }
        service_section:
          type: array
          items:
            $ref: '#/components/schemas/ServiceSectionItem'
        banner_explore_text: { type: string }
        services_title: { type: string }
        video_key: { type: string, nullable: true }
        seo:
          $ref: '#/components/schemas/ContentSeo'
    PublicFlycatchSaudiArabiaList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicFlycatchSaudiArabia'
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

  responses:
    PublicNotFound:
      description: Unknown or unpublished
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
