openapi: 3.1.0
info:
  title: Public News
  version: 1.0.0
servers:
  - url: /api/v1
security: []
paths:

  /public/news:
    get:
      operationId: listPublicNews
      summary: List published records
      tags: [public]

      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10

      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNewsList'


  /public/news/{slug}:
    get:
      operationId: getPublicNews
      summary: Return one published record
      tags: [public]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNews'
        '404':
          $ref: '#/components/responses/PublicNotFound'

components:
  schemas:

    ContentSeo:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        description: { type: string }
        canonical_url: { type: string }
        meta_title: { type: string }
        h1_tag: { type: string }
        image_alt: { type: string }
        image_key: { type: string, nullable: true }


    PublicAuthor:
      type: object
      additionalProperties: false
      required: [name, bio, designation, writer_image_keys]
      properties:
        name: { type: string }
        bio: { type: string }
        designation: { type: string }
        writer_image_keys:
          type: array
          items: { type: string }
    PublicNewsCategory:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
    PublicResourceCategory:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }

    PublicNews:
      type: object
      additionalProperties: false
      required: [title, slug, body, news_categories, authors, image_key, description, button_name, reading_time, facebook, linkedin, twitter, instagram, youtube_url, seo]
      properties:
        title: { type: string }
        slug: { type: string }
        body: { type: string }
        news_categories:
          type: array
          items:
            $ref: '#/components/schemas/PublicNewsCategory'
        authors:
          type: array
          items:
            $ref: '#/components/schemas/PublicAuthor'
        image_key: { type: string, nullable: true }
        description: { type: string }
        button_name: { type: string }
        reading_time: { type: integer }
        facebook: { type: string }
        linkedin: { type: string }
        twitter: { type: string }
        instagram: { type: string }
        youtube_url: { type: string }
        seo:
          $ref: '#/components/schemas/ContentSeo'
    PublicNewsList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicNews'
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
  responses:

    PublicNotFound:
      description: Unknown or unpublished
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string

