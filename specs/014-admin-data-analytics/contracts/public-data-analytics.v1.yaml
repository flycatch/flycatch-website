openapi: 3.1.0
info:
  title: Public Data Analytics & Migration
  version: 1.0.0
  summary: Read-only published Data Analytics & Migration for the website frontend.
servers:
  - url: /api/v1
security: []
paths:
  /public/data-analytics:
    get:
      operationId: listPublicDataAnalytic
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 10 }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataAnalyticList'
  /public/data-analytics/{page_name}:
    get:
      operationId: getPublicDataAnalytic
      parameters:
        - name: page_name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PageName'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataAnalytic'
        '404':
          description: Unknown or unpublished page
components:
  schemas:
    PageName:
      type: string
      enum:
        - data-management
        - data-management-strategy
        - data-engineering
        - visualization-and-intelligence
        - data-migration
        - big-data-analytics
    ContentSeo:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, default: '' }
        description: { type: string, default: '' }
        canonical_url: { type: string, default: '' }
        meta_title: { type: string, default: '' }
        h1_tag: { type: string, default: '' }
        image_alt: { type: string, default: '' }
        image_key: { type: string, nullable: true }
    AccordionItem:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, default: '' }
        contents: { type: string, default: '' }
        order: { type: integer, minimum: 0, default: 0 }
    PublicDataAnalyticSummary:
      type: object
      additionalProperties: false
      required: [page_name, banner_title, banner_image_key, introduction_title]
      properties:
        page_name: { $ref: '#/components/schemas/PageName' }
        banner_title: { type: string }
        banner_image_key: { type: string, nullable: true }
        introduction_title: { type: string }
    PublicDataAnalyticList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicDataAnalyticSummary' }
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    PublicDataAnalytic:
      type: object
      additionalProperties: false
      required: [page_name, banner_title, banner_image_key, introduction_title, introduction_first_paragraph, introduction_second_paragraph, accordion, offering_image_key, offering_title, offering_description, faq_title, faq_description, faq_accordion, seo]
      properties:
        page_name: { $ref: '#/components/schemas/PageName' }
        banner_title: { type: string }
        banner_image_key: { type: string, nullable: true }
        introduction_title: { type: string }
        introduction_first_paragraph: { type: string }
        introduction_second_paragraph: { type: string }
        accordion:
          type: array
          items: { $ref: '#/components/schemas/AccordionItem' }
        offering_image_key: { type: string, nullable: true }
        offering_title: { type: string }
        offering_description: { type: string }
        faq_title: { type: string }
        faq_description: { type: string }
        faq_accordion:
          type: array
          items: { $ref: '#/components/schemas/AccordionItem' }
        seo: { $ref: '#/components/schemas/ContentSeo' }
