openapi: 3.1.0
info:
  title: Administration Client Logos
  version: 1.0.0
  summary: CRUD for client logos.
  description: |
    Staff with records.view may list and read client logos. Staff with
    drafts.save may create, update, and delete them. Status draft/publish
    is stored on each row and does not use the site-settings/page publish
    snapshot pipeline. Media uploads remain on /admin/media from
    admin-blogs.v1.yaml.

    Public published reads are defined in public-client-logos.v1.yaml.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /admin/client-logos:
    get:
      operationId: listClientLogos
      summary: List client logos with search and pagination of 10
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Paginated client logo list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLogoList'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
    post:
      operationId: createClientLogo
      summary: Create a client logo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientLogoWrite'
      responses:
        '201':
          description: Created client logo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLogo'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/FieldErrors'
  /admin/client-logos/{logo_id}:
    parameters:
      - $ref: '#/components/parameters/ClientLogoId'
    get:
      operationId: getClientLogo
      summary: Return one client logo
      responses:
        '200':
          description: Client logo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLogo'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ClientLogoNotFound'
    patch:
      operationId: updateClientLogo
      summary: Update a client logo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientLogoWrite'
      responses:
        '200':
          description: Updated client logo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLogo'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ClientLogoNotFound'
        '422':
          $ref: '#/components/responses/FieldErrors'
    delete:
      operationId: deleteClientLogo
      summary: Delete a client logo
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ClientLogoNotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClientLogoId:
      name: logo_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ContentStatus:
      type: string
      enum: [draft, publish]
    ClientLogo:
      type: object
      additionalProperties: false
      required: [id, colour_logo_key, white_logo_key, alt_text, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        colour_logo_key:
          type: string
          nullable: true
        white_logo_key:
          type: string
          nullable: true
        alt_text:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
        created_at:
          type: string
          format: date-time
    ClientLogoSummary:
      type: object
      additionalProperties: false
      required: [id, colour_logo_key, white_logo_key, alt_text, state]
      properties:
        id:
          type: string
          format: uuid
        colour_logo_key:
          type: string
          nullable: true
        white_logo_key:
          type: string
          nullable: true
        alt_text:
          type: string
        state:
          $ref: '#/components/schemas/ContentStatus'
    ClientLogoList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientLogoSummary'
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    ClientLogoWrite:
      type: object
      additionalProperties: false
      required: [alt_text]
      properties:
        colour_logo_key:
          type: string
          nullable: true
        white_logo_key:
          type: string
          nullable: true
        alt_text:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/ContentStatus'
          default: draft
    FieldErrorDetail:
      type: object
      additionalProperties: false
      required: [message_key]
      properties:
        message_key:
          type: string
    FieldErrors:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldErrorDetail'
  responses:
    FieldErrors:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FieldErrors'
    ClientLogoNotFound:
      description: Unknown client logo
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
                const: admin.client_logos.not_found
