openapi: 3.1.0
info:
  title: Public Downloads
  version: 1.0.0
servers:
  - url: /api/v1
security: []
paths:
  /public/downloads:
    get:
      operationId: listPublicDownloads
      summary: List published records
      tags: [public]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDownloadList'
  /public/downloads/{download_id}:
    get:
      operationId: getPublicDownloads
      summary: Return one published record
      tags: [public]
      parameters:
        - name: download_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDownload'
        '404':
          $ref: '#/components/responses/PublicNotFound'
  /public/downloads/{download_id}/requests:
    post:
      operationId: createPublicDownloadRequest
      summary: Record a gated download request and return the file reference
      tags: [public]
      security: []
      parameters:
        - name: download_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicDownloadRequestWrite'
      responses:
        '201':
          description: Request stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDownloadRequest'
        '404':
          $ref: '#/components/responses/PublicNotFound'
        '422':
          $ref: '#/components/responses/FieldErrors'
components:
  schemas:

    PublicDownload:
      type: object
      additionalProperties: false
      required: [id, name, company, file_key]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        company: { type: string }
        file_key: { type: string }
    PublicDownloadRequestWrite:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        company: { type: string, maxLength: 200 }
        website: { type: string, maxLength: 200, description: Honeypot; must be empty }
        recaptcha_token: { type: string }
    PublicDownloadRequest:
      type: object
      additionalProperties: false
      required: [id, download_id, name, email, company, file_key]
      properties:
        id: { type: string, format: uuid }
        download_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: string }
        file_key: { type: string }
    PublicDownloadList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicDownload'
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

  responses:
    PublicNotFound:
      description: Unknown or unpublished
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
    FieldErrors:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [fields]
            properties:
              fields:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: false
                  required: [message_key]
                  properties:
                    message_key: { type: string }
