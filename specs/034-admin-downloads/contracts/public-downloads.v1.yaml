openapi: 3.1.0
info:
  title: Public Downloads
  version: 1.0.0
servers:
  - url: /api/v1
security: []
paths:
  /public/downloads:
    get:
      operationId: listPublicDownloads
      summary: List published records
      tags: [public]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDownloadList'
  /public/downloads/{download_id}:
    get:
      operationId: getPublicDownloads
      summary: Return one published record
      tags: [public]
      parameters:
        - name: download_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDownload'
        '404':
          $ref: '#/components/responses/PublicNotFound'
components:
  schemas:

    PublicDownload:
      type: object
      additionalProperties: false
      required: [id, name, company, file_key]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        company: { type: string }
        file_key: { type: string }
    PublicDownloadList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicDownload'
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

  responses:
    PublicNotFound:
      description: Unknown or unpublished
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
