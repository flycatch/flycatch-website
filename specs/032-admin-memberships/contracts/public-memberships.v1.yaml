openapi: 3.1.0
info:
  title: Public Memberships
  version: 1.0.0
servers:
  - url: /api/v1
security: []
paths:

  /public/memberships:
    get:
      operationId: listPublicMemberships
      summary: List published records
      tags: [public]

      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10

      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMembershipList'


  /public/memberships/{membership_id}:
    get:
      operationId: getPublicMembership
      summary: Return one published record
      tags: [public]
      parameters:
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMembership'
        '404':
          $ref: '#/components/responses/PublicNotFound'

components:
  schemas:

    ContentSeo:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        description: { type: string }
        canonical_url: { type: string }
        meta_title: { type: string }
        h1_tag: { type: string }
        image_alt: { type: string }
        image_key: { type: string, nullable: true }

    MembershipImage:
      type: object
      additionalProperties: false
      properties:
        image_key: { type: string, nullable: true }
        alt: { type: string }
    PublicMembership:
      type: object
      additionalProperties: false
      required: [id, title, description, images, seo]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        images:
          type: array
          items:
            $ref: '#/components/schemas/MembershipImage'
        seo:
          $ref: '#/components/schemas/ContentSeo'
    PublicMembershipList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicMembership'
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
  responses:

    PublicNotFound:
      description: Unknown or unpublished
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string

