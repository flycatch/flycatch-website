openapi: 3.1.0
info:
  title: Administration Openings
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:

  /admin/openings:
    get:
      operationId: listOpening
      summary: List with search and pagination of 10
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningList'

        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'

    post:
      operationId: createOpening
      summary: Create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opening'

        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'

        '422':
          $ref: '#/components/responses/FieldErrors'
  /admin/openings/bulk-unpublish:
    post:
      operationId: bulkUnpublishOpenings
      summary: Set selected published entries to draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Bulk action result
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          description: One or more records were not found

  /admin/openings/bulk-delete:
    post:
      operationId: bulkDeleteOpenings
      summary: Delete selected entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Bulk action result
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          description: One or more records were not found


  /admin/openings/{opening_id}:
    parameters:
      - name: opening_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOpening
      summary: Return one record
      responses:
        '200':
          description: Record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opening'

        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'

        '404':
          $ref: '#/components/responses/OpeningNotFound'
    patch:
      operationId: updateOpening
      summary: Update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningWrite'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opening'

        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'

        '404':
          $ref: '#/components/responses/OpeningNotFound'
        '422':
          $ref: '#/components/responses/FieldErrors'
    delete:
      operationId: deleteOpening
      summary: Delete
      responses:
        '204':
          description: Deleted

        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'

        '404':
          $ref: '#/components/responses/OpeningNotFound'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ContentStatus:
      type: string
      enum: [draft, publish]
    FieldErrorDetail:
      type: object
      additionalProperties: false
      required: [message_key]
      properties:
        message_key:
          type: string
    FieldErrors:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldErrorDetail'

    EmbeddedApplication:
      type: object
      additionalProperties: false
      required: [id, resume_key, resume_format, name, last_name, email, phone, opened, current_ctc, expected_ctc, notice_period, experience, additional_info, openings, status, created_at]
      properties:

        id: { type: string, format: uuid }
        resume_key: { type: string, nullable: true }
        resume_format: { type: string }
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        opened: { type: boolean }
        current_ctc: { type: number, minimum: 0 }
        expected_ctc: { type: number, minimum: 0 }
        notice_period: { type: number, minimum: 0 }
        experience: { type: number, minimum: 0 }
        additional_info: { type: string }
        openings: { type: string }
        status:
          $ref: '#/components/schemas/ContentStatus'
        created_at: { type: string, format: date-time }

    Opening:
      type: object
      additionalProperties: false
      required: [id, job_id, exp_date, role, slug, experience, location, job_type, job_status, specialization, body, application_ids, applications, status, created_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string }
        exp_date: { type: string, format: date, nullable: true }
        role: { type: string }
        slug: { type: string }
        experience: { type: string }
        location: { type: string, enum: [Kochi, Saudi Arabia, Hybrid, Remote] }
        job_type: { type: string, enum: [Full-Time, Part-Time, Contract] }
        job_status: { type: string, enum: [Opening Soon, Ongoing] }
        specialization: { type: string, enum: [Frontend, Backend, DevOps, Testing, BDE, CMS, FullStack, UI/UX, IT Recruiter] }
        body: { type: string }
        application_ids:
          type: array
          items: { type: string, format: uuid }
        applications:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddedApplication'
        status:
          $ref: '#/components/schemas/ContentStatus'
        created_at: { type: string, format: date-time }
    OpeningSummary:
      type: object
      additionalProperties: false
      required: [id, job_id, exp_date, role, state]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string }
        exp_date: { type: string, format: date, nullable: true }
        role: { type: string }
        state:
          $ref: '#/components/schemas/ContentStatus'

    OpeningList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpeningSummary'
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    OpeningWrite:
      type: object
      additionalProperties: false
      required: [job_id, role]
      properties:
        job_id: { type: string, minLength: 1, maxLength: 80 }
        exp_date: { type: string, format: date, nullable: true }
        role: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, maxLength: 128 }
        experience: { type: string, default: '', maxLength: 200 }
        location: { type: string, enum: [Kochi, Saudi Arabia, Hybrid, Remote], default: Kochi }
        job_type: { type: string, enum: [Full-Time, Part-Time, Contract], default: Full-Time }
        job_status: { type: string, enum: [Opening Soon, Ongoing], default: Ongoing }
        specialization: { type: string, enum: [Frontend, Backend, DevOps, Testing, BDE, CMS, FullStack, UI/UX, IT Recruiter], default: FullStack }
        body: { type: string, default: '' }
        application_ids:
          type: array
          items: { type: string, format: uuid }
          default: []
        status:
          $ref: '#/components/schemas/ContentStatus'
          default: draft

  responses:
    FieldErrors:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FieldErrors'
    OpeningNotFound:
      description: Unknown record
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
                const: admin.openings.not_found

