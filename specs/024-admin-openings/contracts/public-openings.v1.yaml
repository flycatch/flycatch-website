openapi: 3.1.0
info:
  title: Public Openings
  version: 1.0.0
servers:
  - url: /api/v1
security: []
paths:

  /public/openings:
    get:
      operationId: listPublicOpenings
      summary: List published records
      tags: [public]

      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10

      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOpeningList'


  /public/openings/{slug}:
    get:
      operationId: getPublicOpening
      summary: Return one published record
      tags: [public]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOpening'
        '404':
          $ref: '#/components/responses/PublicNotFound'

components:
  schemas:
    PublicApplication:
      type: object
      additionalProperties: false
      required: [id, resume_key, resume_format, name, last_name, email, phone, opened, current_ctc, expected_ctc, notice_period, experience, additional_info, openings]
      properties:
        id: { type: string, format: uuid }
        resume_key: { type: string, nullable: true }
        resume_format: { type: string }
        name: { type: string }
        last_name: { type: string }
        email: { type: string }
        phone: { type: string }
        opened: { type: boolean }
        current_ctc: { type: number }
        expected_ctc: { type: number }
        notice_period: { type: number }
        experience: { type: number }
        additional_info: { type: string }
        openings: { type: string }
    PublicOpening:
      type: object
      additionalProperties: false
      required: [job_id, exp_date, role, slug, experience, location, job_type, job_status, specialization, body, applications]
      properties:
        job_id: { type: string }
        exp_date: { type: string, format: date, nullable: true }
        role: { type: string }
        slug: { type: string }
        experience: { type: string }
        location: { type: string }
        job_type: { type: string }
        job_status: { type: string }
        specialization: { type: string }
        body: { type: string }
        applications:
          type: array
          items:
            $ref: '#/components/schemas/PublicApplication'
    PublicOpeningList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicOpening'
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
  responses:

    PublicNotFound:
      description: Unknown or unpublished
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string

