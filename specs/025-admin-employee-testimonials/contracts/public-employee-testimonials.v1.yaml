openapi: 3.1.0
info:
  title: Public Employee Testimonials
  version: 1.0.0
servers:
  - url: /api/v1
security: []
paths:

  /public/employee-testimonials:
    get:
      operationId: listPublicEmployeeTestimonials
      summary: List published records
      tags: [public]

      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10

      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmployeeTestimonialList'


  /public/employee-testimonials/{testimonial_id}:
    get:
      operationId: getPublicEmployeeTestimonial
      summary: Return one published record
      tags: [public]
      parameters:
        - name: testimonial_id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmployeeTestimonial'
        '404':
          $ref: '#/components/responses/PublicNotFound'

components:
  schemas:
    PublicEmployeeTestimonial:
      type: object
      additionalProperties: false
      required: [id, name, designation, review, image_key, order, listed, publish_date]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        designation: { type: string }
        review: { type: string }
        image_key: { type: string, nullable: true }
        order: { type: integer }
        listed: { type: boolean }
        publish_date: { type: string, format: date, nullable: true }
    PublicEmployeeTestimonialList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicEmployeeTestimonial'
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
  responses:

    PublicNotFound:
      description: Unknown or unpublished
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string

