openapi: 3.1.0
info:
  title: Administration Employee Testimonials
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:

  /admin/employee-testimonials:
    get:
      operationId: listEmployeeTestimonial
      summary: List with search and pagination of 10
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTestimonialList'

        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'

    post:
      operationId: createEmployeeTestimonial
      summary: Create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeTestimonialWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTestimonial'

        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'

        '422':
          $ref: '#/components/responses/FieldErrors'
  /admin/employee-testimonials/{testimonial_id}:
    parameters:
      - name: testimonial_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEmployeeTestimonial
      summary: Return one record
      responses:
        '200':
          description: Record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTestimonial'

        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'

        '404':
          $ref: '#/components/responses/EmployeeTestimonialNotFound'
    patch:
      operationId: updateEmployeeTestimonial
      summary: Update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeTestimonialWrite'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTestimonial'

        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'

        '404':
          $ref: '#/components/responses/EmployeeTestimonialNotFound'
        '422':
          $ref: '#/components/responses/FieldErrors'
    delete:
      operationId: deleteEmployeeTestimonial
      summary: Delete
      responses:
        '204':
          description: Deleted

        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'

        '404':
          $ref: '#/components/responses/EmployeeTestimonialNotFound'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ContentStatus:
      type: string
      enum: [draft, publish]
    FieldErrorDetail:
      type: object
      additionalProperties: false
      required: [message_key]
      properties:
        message_key:
          type: string
    FieldErrors:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldErrorDetail'

    EmployeeTestimonial:
      type: object
      additionalProperties: false
      required: [id, name, designation, review, image_key, order, listed, publish_date, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        designation: { type: string }
        review: { type: string }
        image_key: { type: string, nullable: true }
        order: { type: integer, minimum: 0 }
        listed: { type: boolean }
        publish_date: { type: string, format: date, nullable: true }
        status:
          $ref: '#/components/schemas/ContentStatus'
        created_at: { type: string, format: date-time }
    EmployeeTestimonialSummary:
      type: object
      additionalProperties: false
      required: [id, name, designation, image_key, state]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        designation: { type: string }
        image_key: { type: string, nullable: true }
        state:
          $ref: '#/components/schemas/ContentStatus'

    EmployeeTestimonialList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeTestimonialSummary'
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    EmployeeTestimonialWrite:
      type: object
      additionalProperties: false
      required: [name, review]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        designation: { type: string, default: '', maxLength: 200 }
        review: { type: string, minLength: 1 }
        image_key: { type: string, nullable: true }
        order: { type: integer, minimum: 0, default: 0 }
        listed: { type: boolean, default: false }
        publish_date: { type: string, format: date, nullable: true }
        status:
          $ref: '#/components/schemas/ContentStatus'
          default: draft

  responses:
    FieldErrors:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FieldErrors'
    EmployeeTestimonialNotFound:
      description: Unknown record
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
                const: admin.employee_testimonials.not_found

