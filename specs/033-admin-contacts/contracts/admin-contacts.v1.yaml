openapi: 3.1.0
info:
  title: Administration Contacts
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /admin/contacts:
    get:
      operationId: listContacts
      summary: List with search and pagination of 10
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
    post:
      operationId: createContacts
      summary: Create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/FieldErrors'
  /admin/contacts/{contact_id}:
    parameters:
      - name: contact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getContacts
      summary: Return one record
      responses:
        '200':
          description: Record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/RecordNotFound'
    patch:
      operationId: updateContacts
      summary: Update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactWrite'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/RecordNotFound'
        '422':
          $ref: '#/components/responses/FieldErrors'
    delete:
      operationId: deleteContacts
      summary: Delete
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/RecordNotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:

    Contact:
      type: object
      additionalProperties: false
      required: [id, name, last_name, email, country, phone, subject, details, contact_type, company_name, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        country: { type: string }
        phone: { type: string }
        subject: { type: string }
        contact_date: { type: string, format: date, nullable: true }
        details: { type: string }
        contact_type: { type: string }
        company_name: { type: string }
        status:
          $ref: '#/components/schemas/ContentStatus'
        created_at: { type: string, format: date-time }
    ContactSummary:
      type: object
      additionalProperties: false
      required: [id, name, email, country, state]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        country: { type: string }
        state:
          $ref: '#/components/schemas/ContentStatus'
    ContactList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactSummary'
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    ContactWrite:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        last_name: { type: string, default: '', maxLength: 120 }
        email: { type: string, format: email }
        country: { type: string, default: '', maxLength: 120 }
        phone: { type: string, default: '', maxLength: 40 }
        subject: { type: string, default: '', maxLength: 200 }
        contact_date: { type: string, format: date, nullable: true }
        details: { type: string, default: '' }
        contact_type: { type: string, default: '', maxLength: 120 }
        company_name: { type: string, default: '', maxLength: 200 }
        status:
          $ref: '#/components/schemas/ContentStatus'
          default: draft

    FieldErrorDetail:
      type: object
      additionalProperties: false
      required: [message_key]
      properties:
        message_key:
          type: string
    FieldErrors:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldErrorDetail'
    ContentStatus:
      type: string
      enum: [draft, publish]
  responses:
    FieldErrors:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FieldErrors'
    RecordNotFound:
      description: Unknown record
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
