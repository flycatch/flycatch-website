openapi: 3.1.0
info:
  title: Public Contacts
  version: 1.0.0
servers:
  - url: /api/v1
security: []
paths:
  /public/contacts:
    get:
      operationId: listPublicContacts
      summary: List published records
      tags: [public]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContactList'
  /public/contacts/{contact_id}:
    get:
      operationId: getPublicContacts
      summary: Return one published record
      tags: [public]
      parameters:
        - name: contact_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContact'
        '404':
          $ref: '#/components/responses/PublicNotFound'
components:
  schemas:

    PublicContact:
      type: object
      additionalProperties: false
      required: [id, name, last_name, email, country, phone, subject, details, contact_type, company_name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        country: { type: string }
        phone: { type: string }
        subject: { type: string }
        contact_date: { type: string, format: date, nullable: true }
        details: { type: string }
        contact_type: { type: string }
        company_name: { type: string }
    PublicContactList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicContact'
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

  responses:
    PublicNotFound:
      description: Unknown or unpublished
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
