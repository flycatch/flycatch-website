openapi: 3.1.0
info:
  title: Public Contacts
  version: 1.1.0
  summary: Visitor contact submissions. Personal records are not publicly readable.
servers:
  - url: /api/v1
security: []
paths:
  /public/contacts:
    post:
      operationId: createPublicContact
      summary: Persist a visitor contact enquiry
      tags: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicContactWrite'
      responses:
        '201':
          description: Submission stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContact'
        '422':
          $ref: '#/components/responses/FieldErrors'
  /public/forms/contact/submissions:
    post:
      operationId: createPublicContactFormSubmission
      summary: Persist a visitor contact enquiry via the form stub path
      tags: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicContactWrite'
      responses:
        '201':
          description: Submission stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContact'
        '422':
          $ref: '#/components/responses/FieldErrors'
components:
  schemas:
    PublicContactWrite:
      type: object
      additionalProperties: false
      required: [name, last_name, email, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        last_name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        country: { type: string, maxLength: 120 }
        phone: { type: string, minLength: 1, maxLength: 40 }
        subject: { type: string, maxLength: 200 }
        details: { type: string }
        contact_type: { type: string, maxLength: 120 }
        company_name: { type: string, maxLength: 200 }
        website: { type: string, maxLength: 200, description: Honeypot; must be empty }
        recaptcha_token: { type: string }
    PublicContact:
      type: object
      additionalProperties: false
      required: [id, name, last_name, email, country, phone, subject, details, contact_type, company_name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        country: { type: string }
        phone: { type: string }
        subject: { type: string }
        contact_date: { type: string, format: date, nullable: true }
        details: { type: string }
        contact_type: { type: string }
        company_name: { type: string }
  responses:
    FieldErrors:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [fields]
            properties:
              fields:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: false
                  required: [message_key]
                  properties:
                    message_key: { type: string }
