openapi: 3.1.0
info:
  title: Public Terms
  version: 1.0.0
servers:
  - url: /api/v1
security: []
paths:
  /public/terms:
    get:
      operationId: listPublicTerms
      summary: List published records
      tags: [public]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 10 }
      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLegalPageList'
  /public/terms/{slug}:
    get:
      operationId: getPublicTerms
      summary: Return one published record
      tags: [public]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLegalPage'
        '404':
          $ref: '#/components/responses/PublicNotFound'
components:
  schemas:
    ContentSeo:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        description: { type: string }
        canonical_url: { type: string }
        meta_title: { type: string }
        h1_tag: { type: string }
        image_alt: { type: string }
        image_key: { type: string, nullable: true }
    PublicLegalPage:
      type: object
      additionalProperties: false
      required: [title, slug, body, seo]
      properties:
        title: { type: string }
        slug: { type: string }
        body: { type: string }
        seo:
          $ref: '#/components/schemas/ContentSeo'
    PublicLegalPageList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicLegalPage'
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
  responses:
    PublicNotFound:
      description: Unpublished or unknown record
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code: { type: string, const: not_found }
              message_key: { type: string, const: public.terms.not_found }
