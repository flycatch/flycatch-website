openapi: 3.1.0
info:
  title: Public Applications
  version: 1.0.0
  summary: Published job applications.
servers:
  - url: /api/v1
security: []
paths:

  /public/applications:
    get:
      operationId: listPublicApplications
      summary: List published records
      tags: [public]

      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10

      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApplicationList'


  /public/applications/{application_id}:
    get:
      operationId: getPublicApplication
      summary: Return one published record
      tags: [public]
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApplication'
        '404':
          $ref: '#/components/responses/PublicNotFound'

components:
  schemas:
    PublicApplication:
      type: object
      additionalProperties: false
      required: [id, resume_key, resume_format, name, last_name, email, phone, opened, current_ctc, expected_ctc, notice_period, experience, additional_info, openings]
      properties:
        id: { type: string, format: uuid }
        resume_key: { type: string, nullable: true }
        resume_format: { type: string }
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        opened: { type: boolean }
        current_ctc: { type: number, minimum: 0 }
        expected_ctc: { type: number, minimum: 0 }
        notice_period: { type: number, minimum: 0 }
        experience: { type: number, minimum: 0 }
        additional_info: { type: string }
        openings: { type: string }
    PublicApplicationList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicApplication'
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
  responses:

    PublicNotFound:
      description: Unknown or unpublished
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string

