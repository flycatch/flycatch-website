openapi: 3.1.0
info:
  title: Public Applications
  version: 1.1.0
  summary: Visitor job applications. Personal records are not publicly readable.
servers:
  - url: /api/v1
security: []
paths:
  /public/applications:
    post:
      operationId: createPublicApplication
      summary: Persist a career application with a résumé file
      tags: [public]
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicApplicationWrite'
      responses:
        '201':
          description: Application stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApplication'
        '422':
          $ref: '#/components/responses/FieldErrors'
components:
  schemas:
    PublicApplicationWrite:
      type: object
      additionalProperties: false
      required: [name, last_name, email, phone, resume]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        last_name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 1, maxLength: 40 }
        additional_info: { type: string }
        opening_slug: { type: string }
        current_ctc: { type: number, minimum: 0 }
        expected_ctc: { type: number, minimum: 0 }
        notice_period: { type: number, minimum: 0 }
        experience: { type: number, minimum: 0 }
        website: { type: string, maxLength: 200, description: Honeypot; must be empty }
        recaptcha_token: { type: string }
        resume:
          type: string
          format: binary
    PublicApplication:
      type: object
      additionalProperties: false
      required: [id, resume_key, resume_format, name, last_name, email, phone, opened, current_ctc, expected_ctc, notice_period, experience, additional_info, openings]
      properties:
        id: { type: string, format: uuid }
        resume_key: { type: string, nullable: true }
        resume_format: { type: string }
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        opened: { type: boolean }
        current_ctc: { type: number, minimum: 0 }
        expected_ctc: { type: number, minimum: 0 }
        notice_period: { type: number, minimum: 0 }
        experience: { type: number, minimum: 0 }
        additional_info: { type: string }
        openings: { type: string }
  responses:
    FieldErrors:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [fields]
            properties:
              fields:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: false
                  required: [message_key]
                  properties:
                    message_key: { type: string }
