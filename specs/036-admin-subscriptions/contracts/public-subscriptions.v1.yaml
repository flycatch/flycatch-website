openapi: 3.1.0
info:
  title: Public Subscriptions
  version: 1.0.0
servers:
  - url: /api/v1
security: []
paths:
  /public/subscriptions:
    post:
      operationId: createPublicSubscription
      summary: Visitor newsletter subscribe
      tags: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicSubscriptionWrite'
      responses:
        '201':
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSubscription'
        '422':
          $ref: '#/components/responses/FieldErrors'
    get:
      operationId: listPublicSubscriptions
      summary: List published records
      tags: [public]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSubscriptionList'
  /public/subscriptions/{subscription_id}:
    get:
      operationId: getPublicSubscriptions
      summary: Return one published record
      tags: [public]
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSubscription'
        '404':
          $ref: '#/components/responses/PublicNotFound'
components:
  schemas:
    PublicSubscriptionWrite:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }

    PublicSubscription:
      type: object
      additionalProperties: false
      required: [id, email, active, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    PublicSubscriptionList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicSubscription'
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

  responses:
    FieldErrors:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [fields]
            properties:
              fields:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: false
                  required: [message_key]
                  properties:
                    message_key: { type: string }
    PublicNotFound:
      description: Unknown or unpublished
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
