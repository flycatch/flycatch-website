openapi: 3.1.0
info:
  title: Public Subscriptions
  version: 1.0.0
servers:
  - url: /api/v1
security: []
paths:
  /public/subscriptions:
    get:
      operationId: listPublicSubscriptions
      summary: List published records
      tags: [public]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Published list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSubscriptionList'
  /public/subscriptions/{subscription_id}:
    get:
      operationId: getPublicSubscriptions
      summary: Return one published record
      tags: [public]
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSubscription'
        '404':
          $ref: '#/components/responses/PublicNotFound'
components:
  schemas:

    PublicSubscription:
      type: object
      additionalProperties: false
      required: [id, email, active, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    PublicSubscriptionList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicSubscription'
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

  responses:
    PublicNotFound:
      description: Unknown or unpublished
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
