openapi: 3.1.0
info:
  title: Administration Subscriptions
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /admin/subscriptions:
    get:
      operationId: listSubscriptions
      summary: List with search and pagination of 10
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionList'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
    post:
      operationId: createSubscriptions
      summary: Create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/FieldErrors'
  /admin/subscriptions/{subscription_id}:
    parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getSubscriptions
      summary: Return one record
      responses:
        '200':
          description: Record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/RecordNotFound'
    patch:
      operationId: updateSubscriptions
      summary: Update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionWrite'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/RecordNotFound'
        '422':
          $ref: '#/components/responses/FieldErrors'
    delete:
      operationId: deleteSubscriptions
      summary: Delete
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/RecordNotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:

    Subscription:
      type: object
      additionalProperties: false
      required: [id, email, active, status, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        active: { type: boolean }
        status:
          $ref: '#/components/schemas/ContentStatus'
        created_at: { type: string, format: date-time }
    SubscriptionSummary:
      type: object
      additionalProperties: false
      required: [id, email, active, created_at, state]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        state:
          $ref: '#/components/schemas/ContentStatus'
    SubscriptionList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionSummary'
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    SubscriptionWrite:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
        active: { type: boolean, default: false }
        status:
          $ref: '#/components/schemas/ContentStatus'
          default: draft

    FieldErrorDetail:
      type: object
      additionalProperties: false
      required: [message_key]
      properties:
        message_key:
          type: string
    FieldErrors:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldErrorDetail'
    ContentStatus:
      type: string
      enum: [draft, publish]
  responses:
    FieldErrors:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FieldErrors'
    RecordNotFound:
      description: Unknown record
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
