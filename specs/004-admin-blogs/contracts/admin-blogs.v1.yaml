openapi: 3.1.0
info:
  title: Administration Blogs Authors and Categories
  version: 1.0.0
  summary: CRUD for blogs, authors, categories, and admin media uploads.
  description: |
    Staff with records.view may list and read blogs, authors, and categories.
    Staff with drafts.save may create, update, and delete them, and upload media.
    Authors and categories are separate entities mapped to blogs with many-to-many
    relations. Blog status draft/publish is stored on the blog row and does not
    use the site-settings/page publish snapshot pipeline.

    The website frontend MUST NOT call these admin paths. Published reads for the
    public site are defined in public-blogs.v1.yaml:

      GET /public/blogs              list published blogs (q, page, per_page)
      GET /public/blogs/{slug}       one published blog by slug

    Drafts MUST NOT appear on those public endpoints. See also spec.md.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /admin/blogs:
    get:
      operationId: listBlogs
      summary: List blogs with search and pagination of 10
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Paginated blog list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogList'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
    post:
      operationId: createBlog
      summary: Create a blog entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogWrite'
      responses:
        '201':
          description: Created blog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogDetail'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/FieldErrors'
  /admin/blogs/{blog_id}:
    parameters:
      - $ref: '#/components/parameters/BlogId'
    get:
      operationId: getBlog
      summary: Return one blog including relations
      responses:
        '200':
          description: Blog detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogDetail'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/BlogNotFound'
    patch:
      operationId: updateBlog
      summary: Update a blog entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogWrite'
      responses:
        '200':
          description: Updated blog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogDetail'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/BlogNotFound'
        '422':
          $ref: '#/components/responses/FieldErrors'
    delete:
      operationId: deleteBlog
      summary: Delete a blog entry
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/BlogNotFound'
  /admin/authors:
    get:
      operationId: listAuthors
      summary: List authors
      responses:
        '200':
          description: Author list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorList'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
    post:
      operationId: createAuthor
      summary: Create an author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorWrite'
      responses:
        '201':
          description: Created author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/FieldErrors'
  /admin/authors/{author_id}:
    parameters:
      - $ref: '#/components/parameters/AuthorId'
    get:
      operationId: getAuthor
      responses:
        '200':
          description: Author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/AuthorNotFound'
    patch:
      operationId: updateAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorWrite'
      responses:
        '200':
          description: Updated author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/AuthorNotFound'
        '422':
          $ref: '#/components/responses/FieldErrors'
    delete:
      operationId: deleteAuthor
      summary: Delete an author that is not assigned to a blog
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/AuthorNotFound'
        '409':
          $ref: '#/components/responses/AuthorInUse'
  /admin/categories:
    get:
      operationId: listCategories
      summary: List categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
    post:
      operationId: createCategory
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/FieldErrors'
  /admin/categories/{category_id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      operationId: getCategory
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
    patch:
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '422':
          $ref: '#/components/responses/FieldErrors'
    delete:
      operationId: deleteCategory
      summary: Delete a category that is not assigned to a blog
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryInUse'
  /admin/media:
    post:
      operationId: uploadMedia
      summary: Upload a single media file to object storage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaObject'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/FieldErrors'
  /admin/media/{media_key}:
    parameters:
      - $ref: '#/components/parameters/MediaKey'
    get:
      operationId: getMedia
      summary: Stream stored media for administration previews
      responses:
        '200':
          description: Media bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/MediaNotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BlogId:
      name: blog_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuthorId:
      name: author_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: category_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaKey:
      name: media_key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
  schemas:
    BlogStatus:
      type: string
      enum: [draft, publish]
    Author:
      type: object
      additionalProperties: false
      required: [id, name, bio, designation, writer_image_keys]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        bio:
          type: string
        designation:
          type: string
        writer_image_keys:
          type: array
          items:
            type: string
    AuthorList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Author'
    AuthorWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        bio:
          type: string
          default: ''
        designation:
          type: string
          default: ''
        writer_image_keys:
          type: array
          items:
            type: string
          default: []
    Category:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CategoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    CategoryWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    BlogSummary:
      type: object
      additionalProperties: false
      required: [id, title, slug, author, content_available_in, state]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        author:
          type: string
        content_available_in:
          type: string
        state:
          $ref: '#/components/schemas/BlogStatus'
    BlogList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlogSummary'
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    BlogDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - slug
        - description
        - body
        - status
        - reading_time
        - image_key
        - image_alt
        - canonical_url
        - facebook
        - linkedin
        - twitter
        - instagram
        - content_available_in
        - author_ids
        - category_ids
        - authors
        - categories
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        body:
          type: string
        status:
          $ref: '#/components/schemas/BlogStatus'
        reading_time:
          type: integer
        image_key:
          type: string
          nullable: true
        image_alt:
          type: string
        canonical_url:
          type: string
        facebook:
          type: string
        linkedin:
          type: string
        twitter:
          type: string
        instagram:
          type: string
        content_available_in:
          type: array
          items:
            type: string
        author_ids:
          type: array
          items:
            type: string
            format: uuid
        category_ids:
          type: array
          items:
            type: string
            format: uuid
        authors:
          type: array
          items:
            $ref: '#/components/schemas/Author'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    BlogWrite:
      type: object
      additionalProperties: false
      required: [title, slug, status]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          default: ''
        body:
          type: string
          default: ''
        status:
          $ref: '#/components/schemas/BlogStatus'
        reading_time:
          type: integer
          minimum: 0
          default: 0
        image_key:
          type: string
          nullable: true
        image_alt:
          type: string
          default: ''
        canonical_url:
          type: string
          default: ''
        facebook:
          type: string
          default: ''
        linkedin:
          type: string
          default: ''
        twitter:
          type: string
          default: ''
        instagram:
          type: string
          default: ''
        author_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
        category_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
    MediaObject:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
    FieldErrorDetail:
      type: object
      additionalProperties: false
      required: [message_key]
      properties:
        message_key:
          type: string
    FieldErrors:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldErrorDetail'
    EntityInUse:
      type: object
      additionalProperties: false
      required: [code, message_key]
      properties:
        code:
          type: string
          const: in_use
        message_key:
          type: string
  responses:
    FieldErrors:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FieldErrors'
    BlogNotFound:
      description: Unknown blog
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
                const: admin.blogs.not_found
    AuthorNotFound:
      description: Unknown author
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
                const: admin.authors.not_found
    CategoryNotFound:
      description: Unknown category
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
                const: admin.categories.not_found
    MediaNotFound:
      description: Unknown media object
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
                const: admin.media.not_found
    AuthorInUse:
      description: Author is assigned to one or more blogs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntityInUse'
    CategoryInUse:
      description: Category is assigned to one or more blogs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntityInUse'
