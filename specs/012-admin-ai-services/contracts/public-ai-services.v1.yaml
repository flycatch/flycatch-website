openapi: 3.1.0
info:
  title: Public AI Services
  version: 1.0.0
  summary: Read-only published AI Services for the website frontend.
servers:
  - url: /api/v1
security: []
paths:
  /public/ai-services:
    get:
      operationId: listPublicAiServices
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 10 }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAiServiceList'
  /public/ai-services/{slug}:
    get:
      operationId: getPublicAiService
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAiService'
        '404':
          description: Unknown or unpublished slug
components:
  schemas:
    ContentSeo:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, default: '' }
        description: { type: string, default: '' }
        canonical_url: { type: string, default: '' }
        meta_title: { type: string, default: '' }
        h1_tag: { type: string, default: '' }
        image_alt: { type: string, default: '' }
        image_key: { type: string, nullable: true }
    IndustryItem:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, default: '' }
        image_key: { type: string, nullable: true }
        order: { type: integer, minimum: 0, default: 0 }
    AccordionItem:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, default: '' }
        contents: { type: string, default: '' }
        order: { type: integer, minimum: 0, default: 0 }
    PublicAiServiceSummary:
      type: object
      additionalProperties: false
      required: [slug, banner_title, banner_image_key, introduction_title]
      properties:
        slug: { type: string }
        banner_title: { type: string }
        banner_image_key: { type: string, nullable: true }
        introduction_title: { type: string }
    PublicAiServiceList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicAiServiceSummary' }
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    PublicAiService:
      type: object
      additionalProperties: false
      required: [slug, banner_title, banner_image_key, introduction_title, introduction_description, solutions_title, solutions_description, industry_title, industry_description, industry_items, ai_expertise_title, ai_expertise_image_key, ai_expertise_accordion, ai_expertise_accordion_description, solutions, faq_title, faq_description, faq_accordion, seo]
      properties:
        slug: { type: string }
        banner_title: { type: string }
        banner_image_key: { type: string, nullable: true }
        introduction_title: { type: string }
        introduction_description: { type: string }
        solutions_title: { type: string }
        solutions_description: { type: string }
        industry_title: { type: string }
        industry_description: { type: string }
        industry_items:
          type: array
          items: { $ref: '#/components/schemas/IndustryItem' }
        ai_expertise_title: { type: string }
        ai_expertise_image_key: { type: string, nullable: true }
        ai_expertise_accordion:
          type: array
          items: { $ref: '#/components/schemas/AccordionItem' }
        ai_expertise_accordion_description: { type: string }
        solutions:
          type: array
          items:
            $ref: '../../010-admin-solution-details/contracts/public-solution-details.v1.yaml#/components/schemas/PublicSolutionDetail'
        faq_title: { type: string }
        faq_description: { type: string }
        faq_accordion:
          type: array
          items: { $ref: '#/components/schemas/AccordionItem' }
        seo: { $ref: '#/components/schemas/ContentSeo' }
