openapi: 3.1.0
info:
  title: Administration Client Testimonials
  version: 1.0.0
  summary: CRUD for client testimonials.
  description: |
    Staff with records.view may list and read client testimonials. Staff with
    drafts.save may create, update, and delete them. Status draft/publish
    is stored on each row and does not use the site-settings/page publish
    snapshot pipeline. Media uploads remain on /admin/media from
    admin-blogs.v1.yaml.

    Public published reads are defined in public-client-testimonials.v1.yaml.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /admin/client-testimonials:
    get:
      operationId: listClientTestimonials
      summary: List client testimonials with search and pagination of 10
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Paginated client testimonial list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientTestimonialList'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
    post:
      operationId: createClientTestimonial
      summary: Create a client testimonial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientTestimonialWrite'
      responses:
        '201':
          description: Created client testimonial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientTestimonial'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/FieldErrors'
  /admin/client-testimonials/{testimonial_id}:
    parameters:
      - $ref: '#/components/parameters/ClientTestimonialId'
    get:
      operationId: getClientTestimonial
      summary: Return one client testimonial
      responses:
        '200':
          description: Client testimonial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientTestimonial'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ClientTestimonialNotFound'
    patch:
      operationId: updateClientTestimonial
      summary: Update a client testimonial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientTestimonialWrite'
      responses:
        '200':
          description: Updated client testimonial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientTestimonial'
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ClientTestimonialNotFound'
        '422':
          $ref: '#/components/responses/FieldErrors'
    delete:
      operationId: deleteClientTestimonial
      summary: Delete a client testimonial
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../../002-auth-rbac/contracts/admin-rbac.v1.yaml#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/ClientTestimonialNotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClientTestimonialId:
      name: testimonial_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ContentStatus:
      type: string
      enum: [draft, publish]
    ClientTestimonial:
      type: object
      additionalProperties: false
      required:
        - id
        - client_name
        - title
        - review
        - client_designation
        - client_company
        - country
        - image_key
        - alt_text
        - is_clutch_review
        - order
        - review_link
        - content_available_in
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        client_name:
          type: string
        title:
          type: string
        review:
          type: string
        client_designation:
          type: string
        client_company:
          type: string
        country:
          type: string
        image_key:
          type: string
          nullable: true
        alt_text:
          type: string
        is_clutch_review:
          type: boolean
        order:
          type: integer
          minimum: 0
        review_link:
          type: string
        content_available_in:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
        created_at:
          type: string
          format: date-time
    ClientTestimonialSummary:
      type: object
      additionalProperties: false
      required: [id, client_name, title, review, content_available_in, state]
      properties:
        id:
          type: string
          format: uuid
        client_name:
          type: string
        title:
          type: string
        review:
          type: string
        content_available_in:
          type: string
        state:
          $ref: '#/components/schemas/ContentStatus'
    ClientTestimonialList:
      type: object
      additionalProperties: false
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientTestimonialSummary'
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    ClientTestimonialWrite:
      type: object
      additionalProperties: false
      required: [client_name, title, review]
      properties:
        client_name:
          type: string
          minLength: 1
          maxLength: 120
        title:
          type: string
          minLength: 1
          maxLength: 200
        review:
          type: string
          minLength: 1
        client_designation:
          type: string
          default: ''
          maxLength: 200
        client_company:
          type: string
          default: ''
          maxLength: 200
        country:
          type: string
          default: ''
          maxLength: 120
        image_key:
          type: string
          nullable: true
        alt_text:
          type: string
          default: ''
          maxLength: 200
        is_clutch_review:
          type: boolean
          default: false
        order:
          type: integer
          minimum: 0
          default: 0
        review_link:
          type: string
          default: ''
          maxLength: 500
        status:
          $ref: '#/components/schemas/ContentStatus'
          default: draft
    FieldErrorDetail:
      type: object
      additionalProperties: false
      required: [message_key]
      properties:
        message_key:
          type: string
    FieldErrors:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldErrorDetail'
  responses:
    FieldErrors:
      description: Field-level validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FieldErrors'
    ClientTestimonialNotFound:
      description: Unknown client testimonial
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message_key]
            properties:
              code:
                type: string
                const: not_found
              message_key:
                type: string
                const: admin.client_testimonials.not_found
