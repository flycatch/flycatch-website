app:
  name: flycatch-website

registry: registry.k3s.flycatchtech.in

notifications:
  enabled: true

# Only `dev` and `prod` (main) have k8s overlays today. qa/uat are stubbed so
# pushes to those branches fail clearly at the GitOps Tag Bump stage (missing
# overlay) instead of "branch not supported".
environments:
  dev: dev
  qa: qa
  uat: uat
  main: prod

versioning:
  releaseBranch: main

gitops:
  overlayPath: deployment/k8s/overlays
  credentialsId: github-credential

images:
  - name: flycatch-website/backend
    dockerfile: apps/Backend/Dockerfile
    context: apps/Backend
    args: {}

  # Frontend build args below are for the `dev` branch pipeline. Production SEO
  # authenticity comes from overlays/prod ConfigMap (PUBLIC_ORIGIN /
  # PUBLIC_ENVIRONMENT) plus runtime process.env reads in the Frontend SSR.
  # Optional future: per-env build args when the shared library supports them.
  # Administration FE must not bake PUBLIC_ORIGIN: the static client is promoted
  # as-is, and an absolute dev host is blocked by production CSP (connect-src 'self').
  # The admin UI calls same-origin /api/v1 through the gateway.
  - name: flycatch-website/frontend
    dockerfile: apps/Frontend/Dockerfile
    context: apps/Frontend
    args:
      PUBLIC_ORIGIN: https://flycatch-website-dev.k3s.flycatchtech.in
      PUBLIC_ENVIRONMENT: development
      PUBLIC_RECAPTCHA_SITE_KEY: 6Ldx3M4tAAAAAEyHUp1Qt8GF3H3JuKHqFbdD9JsH

  - name: flycatch-website/administration-fe
    dockerfile: apps/Administration-FE/Dockerfile
    context: apps/Administration-FE
    additionalContexts:
      specs: specs
    args:
      PUBLIC_ENVIRONMENT: development
